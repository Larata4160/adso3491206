<!DOCTYPE html>
<html lang="en">
<head>

    <title>04-script</title>
    <link rel="stylesheet" href="../src/css/Styles.css">

<body class="html"> 
    <nav class="back">
         <a href="index.html">
            ←
        </a>
    </nav>
    <main>
         <header class="mainmenu">
            <h1>04-script</h1>
            <img src="../src/imgs/logo-html.jpg" alt="Html">
            <h3>Inserts JavaScript code.</h3>
         </header>
         <section>
            <h2 class="subtitle">Welcome:</h2>
            <h3 class="user"></h3>
         </section>
    </main>
    <script>
        const user=document.querySelector('.user');
        const answ = prompt("what's your name?");
        if(answ) {
            user.textContent = '😊' + answ;
        } else {
            user.textContent = '😒 Guest!';
        }
    </script>
</body>
